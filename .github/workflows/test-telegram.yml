name: test-telegram
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests anthropic
      - name: anthropic key check
        run: |
          python -c "
          import anthropic
          r = anthropic.Anthropic().messages.create(model='claude-sonnet-4-6', max_tokens=10, messages=[{'role':'user','content':'say ok'}])
          print('anthropic ok:', r.content[0].text)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: telegram check
        run: python -c "import notify; notify.send('✅ All secrets verified — stock-agent is fully operational.')"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
