name: stock-alert

on:
  schedule:
    # Every 30 min, 13:05-21:35 UTC Mon-Fri — covers 9am-4pm ET in both EST and EDT.
    # main.py re-checks Eastern market hours and exits quietly outside them.
    - cron: "5,35 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Just send a Telegram test message (no scan)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Restore alert memory from the most recent run (cache keys are immutable,
      # so each run saves under a fresh key and restores the newest "state-" match).
      - uses: actions/cache/restore@v5
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - if: ${{ inputs.test }}
        run: python -c "import notify; notify.send('Test ping — stock-agent can reach your Telegram.')"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: ${{ !inputs.test }}
        run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v5
        if: always()
        continue-on-error: true
        with:
          path: state.json
          key: state-${{ github.run_id }}
