name: stock-alert

on:
  schedule:
    # Every 30 min, 13:05-21:35 UTC Mon-Fri — covers 9am-4pm ET in both EST and EDT.
    # main.py re-checks Eastern market hours and exits quietly outside them.
    - cron: "5,35 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a fake test pick through Telegram + sheet (no scan)"
        type: boolean
        default: false
      force:
        description: "Full real scan now, ignoring market hours (may send a real alert)"
        type: boolean
        default: false
      smoke:
        description: "One real Claude judge call on fake candidates (plan usage, no Telegram)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The judge calls `claude -p`, billed to the Claude plan via CLAUDE_CODE_OAUTH_TOKEN.
      - run: npm install -g @anthropic-ai/claude-code@2.1.299 --no-fund --no-audit
      # Restore alert memory from the most recent run (cache keys are immutable,
      # so each run saves under a fresh key and restores the newest "state-" match).
      - uses: actions/cache/restore@v5
        with:
          path: |
            state.json
            picks_log.jsonl
            judge_log.jsonl
          key: state-${{ github.run_id }}
          restore-keys: state-
      - if: ${{ inputs.test }}
        # full pipeline test: real Telegram send + real sheet row, fake pick
        run: |
          python -c "
          import facts, notify, tracker
          picks = [{'ticker': 'AAPL', 'line': 'TEST PICK — pipeline test, delete this row from the sheet'}]
          cands = [{'ticker': 'AAPL', 'score': 0, 'facts': facts.fetch(['AAPL']).get('AAPL', {})}]
          notify.send(picks[0]['line'])
          tracker.log_picks(picks, cands)
          "
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
      - if: ${{ inputs.smoke }}
        # proves the judge request shape is accepted — the scan can't, because the
        # upside gate often empties the candidate list before Claude is ever called
        run: python judge_smoke.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: ${{ !inputs.test && !inputs.smoke }}
        # `force` is empty on scheduled runs, so this is a bare `python main.py` there
        run: python main.py ${{ inputs.force && '--force' || '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          # Paper trading only. broker.py refuses any non-paper host unless
          # ALPACA_ALLOW_LIVE=yes, which is deliberately not set anywhere.
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - uses: actions/cache/save@v5
        if: always()
        continue-on-error: true
        with:
          path: |
            state.json
            picks_log.jsonl
            judge_log.jsonl
          key: state-${{ github.run_id }}
